    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"

    <link rel="stylesheet" href="liquid-glass.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: transparent;
      }
      #viewport {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: transparent;
      }
      #wallpaper-scene {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      .layer {
        position: absolute;
        top: 0;
        left: 0;
        /* Ensure image is overscaled slightly in both dimensions to allow headroom */
        min-width: 114vw;
        min-height: 114vh;
        width: auto;
        height: 114vh;

        /* GPU promotion & subpixel anti-aliasing */
        will-change: transform, opacity;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        image-rendering: -webkit-optimize-contrast;
        object-fit: cover;

        opacity: 0;
        transition: opacity 3s ease-in-out;
      }
      .layer.active {
        opacity: 1;
      }

      /* Simulated macOS Menu Bar Frosted Glass */
      :root {
        --menubar-blur: 15px;
        --menubar-saturate: 140%;
        --menubar-tint-dark: rgba(20, 20, 20, 0.32);
        --menubar-border-dark: rgba(255, 255, 255, 0.12);
      }

      #menubar-glass {
        height: 30px;
        border-radius: 0;
        clip-path: inset(0 0 0 0);
        contain: paint;
        overflow: clip;

        /* Hardware-accelerated frosted glass */
        backdrop-filter: blur(var(--menubar-blur))
          saturate(var(--menubar-saturate));
        -webkit-backdrop-filter: blur(var(--menubar-blur))
          saturate(var(--menubar-saturate));

        /* Dynamic Light / Dark mode tint */
        background: var(--menubar-tint-dark);
        box-shadow: inset 0 0.5px 0 var(--menubar-border-dark);
        transition:
          background 0.3s ease,
          box-shadow 0.3s ease;
      }
    </style>
  </head>

      const INTERVAL_MS = 60000; // 1 minute per photo
      const FADE_MS = 3000; // 3-second crossfade
      const SYNC_NATIVE_WALLPAPER = true; // Set to true if you still want wallpaper_sync.py to change native macOS wallpaper

      let currentLayer = document.getElementById("layerA");
      let nextLayer = document.getElementById("layerB");

      // --- Shuffle Deck System (Fisher-Yates) ---
      // Ensures every wallpaper plays exactly once before repeating,
      // eliminating duplicate clumping and the "same walls over and over" effect.
      let deck = [];
      let lastShown = "";

      function shuffle(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function getNextWallpaper() {
        if (!images || images.length === 0) return "";
        if (images.length === 1) return images[0];

        // Refill and shuffle deck when empty
        if (deck.length === 0) {
          deck = shuffle(images);
          // Avoid immediate repeat across reshuffle boundary
          if (deck[0] === lastShown && deck.length > 1) {
            const swapIdx = Math.floor(Math.random() * (deck.length - 1)) + 1;
            [deck[0], deck[swapIdx]] = [deck[swapIdx], deck[0]];
          }
        }

        const next = deck.shift();
        lastShown = next;
        try {
          localStorage.setItem("current_wallpaper", next);
          localStorage.setItem("wallpaper_deck", JSON.stringify(deck));
        } catch (_) {}
        return next;
      }

      function initDeck() {
        try {
          const savedDeck = JSON.parse(
            localStorage.getItem("wallpaper_deck") || "[]",
          );
          if (
            Array.isArray(savedDeck) &&
            savedDeck.length > 0 &&
            savedDeck.every((img) => images.includes(img))
          ) {
            deck = savedDeck;
          }
          lastShown = localStorage.getItem("current_wallpaper") || "";
        } catch (_) {
          deck = [];
        }
      }

      function calculatePanVector(imgEl, durationMs) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const durationSec = durationMs / 1000;

        // Headroom overscale factor (14% headroom ensures smooth 360-degree panning without edge gaps)
        const OVERSCALE = 1.14;
        const aspect = (imgEl.naturalWidth || 16) / (imgEl.naturalHeight || 9);

        // True rendered dimension matching CSS min-width: 114vw, min-height: 114vh
        const scale = Math.max(
          (vw * OVERSCALE) / (imgEl.naturalWidth || vw),
          (vh * OVERSCALE) / (imgEl.naturalHeight || vh),
        );
        const renderedWidth = (imgEl.naturalWidth || vw) * scale;
        const renderedHeight = (imgEl.naturalHeight || vh) * scale;

        // Maximum available slack before black borders appear
        const maxSlackX = renderedWidth - vw;
        const maxSlackY = renderedHeight - vh;

        // Visual linear speed: min ~3.0 px/s, avg ~4.0 px/s, max ~5.0 px/s
        const speed = 3.0 + Math.random() * 2.0; // 3.0 to 5.0 px/s
        const travelDist = speed * durationSec;

        // True 360-degree random angle
        const angle = Math.random() * 2 * Math.PI;
        let dx = travelDist * Math.cos(angle);
        let dy = travelDist * Math.sin(angle);

        // Keep displacement inside available slack (with 96% safety cushion)
        const safety = 0.96;
        let clampScale = 1.0;
        if (Math.abs(dx) > maxSlackX * safety) {
          clampScale = Math.min(clampScale, (maxSlackX * safety) / Math.abs(dx));
        }
        if (Math.abs(dy) > maxSlackY * safety) {
          clampScale = Math.min(clampScale, (maxSlackY * safety) / Math.abs(dy));
        }
        dx *= clampScale;
        dy *= clampScale;

        // Pick a random starting coordinate within the valid slack window
        const minStartX = -maxSlackX + Math.max(0, -dx);
        const maxStartX = 0 - Math.max(0, dx);
        const startX = minStartX + Math.random() * (maxStartX - minStartX);
        const endX = startX + dx;

        const minStartY = -maxSlackY + Math.max(0, -dy);
        const maxStartY = 0 - Math.max(0, dy);
        const startY = minStartY + Math.random() * (maxStartY - minStartY);
        const endY = startY + dy;

        return {
          from: `translate3d(${startX.toFixed(1)}px, ${startY.toFixed(1)}px, 0)`,
          to: `translate3d(${endX.toFixed(1)}px, ${endY.toFixed(1)}px, 0)`,
        };
      }

      function startKenBurnsAnimation(imgEl, duration) {
        const { from, to } = calculatePanVector(imgEl, duration);
        return imgEl.animate([{ transform: from }, { transform: to }], {
          duration,
          easing: "linear",
          fill: "forwards",
        });
      }

      function syncNativeTheme(imagePath) {
        if (!SYNC_NATIVE_WALLPAPER) return;
        // Sync underlying macOS desktop wallpaper so native desktop matches if enabled
        fetch(
          `http://localhost:8765/sync?file=${encodeURIComponent(imagePath)}`,
          { mode: "no-cors" },
        ).catch(() => {});
      }

      function cycleWallpaper() {
        const targetSrc = getNextWallpaper();
        if (!targetSrc) return;

        nextLayer.onerror = () => {
          console.warn("[live-walls] Failed to load:", targetSrc);
          // Advance to the next card if decode fails
          setTimeout(cycleWallpaper, 100);
        };

        nextLayer.onload = () => {
          startKenBurnsAnimation(nextLayer, INTERVAL_MS + FADE_MS);

          nextLayer.classList.add("active");
          currentLayer.classList.remove("active");

          setTimeout(() => {
            currentLayer.getAnimations()[0]?.cancel();
            [currentLayer, nextLayer] = [nextLayer, currentLayer];

            syncNativeTheme(targetSrc);
            menubarGlass?.syncToBackdrop?.();
          }, FADE_MS - 500);
        };
        nextLayer.src = targetSrc;
      }

      function initWallpaper() {
        initDeck();
        const initialSrc = getNextWallpaper();
        if (!initialSrc) return;

        syncNativeTheme(initialSrc);

        currentLayer.style.transition = "none";
        currentLayer.classList.add("active");

        currentLayer.onerror = () => {
          console.warn("[live-walls] Failed to load initial:", initialSrc);
          setTimeout(cycleWallpaper, 100);
        };

        currentLayer.onload = () => {
          startKenBurnsAnimation(currentLayer, INTERVAL_MS);
          requestAnimationFrame(() => {
            currentLayer.style.transition = "";
          });
        };
        currentLayer.src = initialSrc;
      }

      // Initialize Apple Liquid Glass effect on the navbar
      const menubarEl = document.getElementById("menubar-glass");
      const LiquidGlass = window.LiquidGlass?.LiquidGlass;
      const menubarGlass =
        menubarEl && LiquidGlass
          ? new LiquidGlass(menubarEl, {
              profile: "panel",
              preset: "dramatic",
              refraction: 46,
              thickness: 7,
              chromaticAberration: 0.6,
              quality: "high",
              specular: true,
              specularIntensity: 0.2,
              blur: 1.5,
              saturation: 140,
              scheme: "dark",
              tint: "rgba(20, 20, 20, 0.08)",
              edges: false,
              applyRadius: false,
              radius: 0,
              rimPosition: "bottom",
              backdropSource: "#wallpaper-scene",
              fallbackFilter:
                "blur(var(--menubar-blur)) saturate(var(--menubar-saturate))",
            })
          : null;

      // Warm-start initial photo immediately with zero black delay
      initWallpaper();

      // Loop every INTERVAL_MS
      setInterval(cycleWallpaper, INTERVAL_MS);
